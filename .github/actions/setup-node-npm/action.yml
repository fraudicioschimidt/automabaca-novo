name: setup-node-npm
description: Node a partir de .node-version, npm pinado e node_modules do cache do GitHub (ou npm ci).

inputs:
  install-deps:
    description: Se true, instala as dependências do lockfile (cache do GitHub ou npm ci)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .node-version
        # O cache é o do node_modules inteiro, abaixo. `packageManager` no
        # package.json ligaria o cache do ~/.npm sozinho; desligar explicitamente.
        cache: ""
        package-manager-cache: false
    - name: Pin npm
      shell: bash
      run: '[ "$(npm -v)" = "11.19.0" ] || npm install --global npm@11.19.0'
    # node_modules inteiro, pela chave do lockfile e da versão do Node: o `npm ci`
    # só roda quando o lockfile muda. O cache só é salvo se o job passar.
    - name: Cache do node_modules
      id: deps
      if: inputs.install-deps == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', '.node-version') }}-npm11.19.0
    - name: Instalar dependências
      if: inputs.install-deps == 'true'
      shell: bash
      env:
        ACERTO: ${{ steps.deps.outputs.cache-hit }}
      run: |
        if [ "$ACERTO" = true ]; then
          echo "→ node_modules do cache do GitHub"
          # O `npm ci` rodaria o postinstall (prisma generate → src/generated,
          # fora do node_modules). Mesmo script, mesmo ambiente.
          node scripts/postinstall.mjs
        else
          echo "→ npm ci (lockfile sem cache ainda)"
          npm ci --no-audit --fund=false
        fi
