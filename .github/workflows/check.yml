name: check

on:
  pull_request:
    # `labeled`: o PR do Dependabot só roda quando ganha o rótulo de revisão
    # (ver `verificações`). Nos outros PRs, um rótulo novo roda a CI de novo.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # No PR, o push novo cancela o anterior. Na main, a execução em andamento
  # termina e o commit mais novo espera na fila (um pendente substitui o outro:
  # os commits do meio ficam sem CI, e o publicador os pula). O publicador leva à
  # produção o commit mais novo com a CI verde; cancelar a cada merge deixava a
  # produção parada enquanto os merges seguiam.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Todos os jobs rodam nos runners hospedados do GitHub (`ubuntu-24.04`), cada
# um numa máquina nova: os jobs trocam os registros e o runtime do build por
# ARTEFATO (`ci-*`, de vida curta) e guardam node_modules, tsc e Next no cache
# do GitHub. Repositório privado gasta a cota de minutos do plano; cada minuto
# de cada job conta, então poucos jobs, e grandes. Um PR ocupa dois em paralelo
# (`verificações` e `build e navegador`) e depois um (`release verificada`).
#
# Cada job com banco sobe o PRÓPRIO PostgreSQL em RAM (`scripts/ci-postgres.sh`),
# numa porta aleatória do host, como no desenvolvimento local.
#
# Na main, se o PR já passou por exatamente esta árvore, as verificações dele
# valem (`reaproveitar`, ver `scripts/ci-reaproveitar.mjs`): a main só faz o
# build, a release e as imagens. Qualquer dúvida, e a main roda tudo.

jobs:
  reaproveitar:
    name: reaproveitar a verificação do PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.decidir.outputs.reuse }}
      run: ${{ steps.decidir.outputs.run }}
      commit: ${{ steps.decidir.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-npm
        with:
          install-deps: "false"
      - id: decidir
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-reaproveitar.mjs

  # Estáticas + unitários (`check:ci`) e a suíte com PostgreSQL, em paralelo no
  # mesmo job: a do banco sobe em segundo plano logo no começo e é esperada no
  # fim. Um job em vez de dois economiza o checkout, o setup e o arredondamento
  # de minutos de um job a mais. O `scripts/vez.sh` divide a memória do runner
  # entre as duas suítes.
  verificacoes:
    name: verificações
    needs: reaproveitar
    # `!cancelled()`: no PR o `reaproveitar` é pulado, e sem isto este job
    # seria pulado junto.
    #
    # PR do Dependabot instala e executa dependência que ninguém leu, e o que
    # entra na main vai sozinho para a produção. Ele só roda no evento em que
    # alguém põe o rótulo `dependencias-revisadas`, depois de ler o diff do
    # lockfile e as notas de versão (e não gasta minutos antes disso). Push novo
    # do Dependabot não herda a revisão: o rótulo sai e volta. Sem ele, este job
    # e o `build` ficam pulados e a `release verificada` reprova, então o PR
    # não entra.
    if: >-
      ${{ !cancelled() && needs.reaproveitar.outputs.reuse != 'true'
      && (github.event.pull_request.user.login != 'dependabot[bot]'
      || (github.event.action == 'labeled' && github.event.label.name == 'dependencias-revisadas')) }}
    runs-on: ubuntu-24.04
    # Inclui a espera pela vez na máquina (scripts/vez.sh): no runner pequeno
    # as estáticas esperam a suíte do banco liberar a memória.
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: PostgreSQL em RAM deste job
        run: bash scripts/ci-postgres.sh subir automabaca_test
      - uses: ./.github/actions/setup-node-npm
      # Processo em segundo plano sobrevive ao fim do passo (o runner só mata os
      # órfãos no fim do job); o passo "Esperar" colhe o resultado.
      - name: Testes com PostgreSQL (em segundo plano)
        run: |
          mkdir -p reports/ci
          nohup bash -c 'node scripts/record-check.mjs database -- npm run test:db > reports/ci/database.log 2>&1; echo "$?" > reports/ci/database.exit' \
            > /dev/null 2>&1 &
          echo "$!" > reports/ci/database.pid
      # Cache do tsc de execuções anteriores: o tsbuildinfo acompanha as
      # dependências entre arquivos. O ESLint roda sem cache (o checkout apaga o
      # .eslintcache): o dele é por arquivo e não vê a mudança de tipo em outro
      # módulo, da qual o no-floating-promises depende. A entrada do cache do
      # GitHub não muda depois de gravada: cada execução grava a sua, e a
      # restauração pega a mais recente do mesmo lockfile.
      - name: Restaurar cache de tipos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tsc-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - name: Workflows válidos (actionlint + shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color=false
      # `nice`: divide a CPU com a suíte do banco e com o build do outro job.
      - run: nice -n 10 node scripts/record-check.mjs static -- npm run check:ci
      # Scripts Python que rodam na VPS (backup, logs, deploy). O de logs cifra
      # e decifra de verdade, por isso precisa do `age`.
      - name: Testes Python do host (deploy/ e infra/observability/)
        run: |
          command -v age-keygen >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }
          python3 -m unittest discover -s deploy -p 'test_*.py'
          python3 -m unittest discover -s infra/observability -p 'test_*.py'
      # A mesma régua do deploy (`deploy/migrar.py`): migration nova tem de ser
      # aditiva ou declarar `-- @migration-manual: <motivo>`; migration já
      # publicada não muda nunca (o banco de produção guarda o hash dela).
      - name: Migrations novas passam na régua do deploy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # `sort` e `[[ > ]]` comparam bytes, como o Prisma e o migrar.py.
          LC_ALL: C
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "sem commit-base para comparar (execução manual); nada a conferir"; exit 0
          fi
          git fetch -q --depth=1 origin "$BASE"
          alteradas=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- 'prisma/migrations/*/migration.sql')
          if [ -n "$alteradas" ]; then
            echo "::error::migration já publicada foi alterada ou apagada: $alteradas"; exit 1
          fi
          # No PR, nova é a que a main de agora não tem. O base.sha do evento
          # pode ser anterior a uma migration que a main já publicou depois, e
          # ela pareceria nova aqui; comparar as árvores dispensa histórico.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch -q --depth=1 origin main
            referencia=$(git rev-parse FETCH_HEAD)
          else
            referencia="$BASE"
          fi
          nomes() { git ls-tree -r --name-only "$1" -- prisma/migrations/ | grep '/migration\.sql$' | sort; }
          mapfile -t novas < <(comm -13 <(nomes "$referencia") <(nomes HEAD))
          if [ "${#novas[@]}" -eq 0 ]; then echo "nenhuma migration nova"; exit 0; fi
          # Migration nova com nome anterior à última da main sai fora de ordem
          # (o deploy aceita, mas o banco de teste e o de produção a aplicam em
          # ordens diferentes). Aviso cedo: um merge sem rebase ainda escapa.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            latest=$(git ls-tree --name-only "$referencia" prisma/migrations/ | sed 's#.*/##' | grep -E '^[0-9]{14}_' | sort | tail -1)
            out_of_order=0
            for file in "${novas[@]}"; do
              name=$(basename "$(dirname "$file")")
              if [[ ! "$name" > "$latest" ]]; then
                echo "::error::$file vem antes de $latest, a última migration da main: renomeie a pasta para um carimbo UTC depois dela"
                out_of_order=1
              fi
            done
            [ "$out_of_order" = 0 ] || exit 1
          fi
          python3 deploy/migrar.py --classificar "${novas[@]}"
      - name: Salvar cache de tipos
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Esperar os testes com PostgreSQL
        run: |
          pid=$(cat reports/ci/database.pid)
          while [ ! -f reports/ci/database.exit ] && kill -0 "$pid" 2>/dev/null; do sleep 2; done
          echo "::group::saída dos testes com PostgreSQL"; cat reports/ci/database.log; echo "::endgroup::"
          codigo=$(cat reports/ci/database.exit 2>/dev/null || echo "sem código: o processo morreu")
          if [ "$codigo" != 0 ]; then
            tail -n 60 reports/ci/database.log
            echo "::error::testes com PostgreSQL falharam ($codigo; log completo no grupo acima)"; exit 1
          fi
      # A suíte apaga os bancos dela ao sair: o `migrate deploy` recria o do
      # job só pelas migrations (uns 20 s), e modelo mudado sem migration
      # aparece no diff.
      - name: Schema do Prisma igual às migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Lidos pela `release verificada` desta execução e, na main, pelo
      # `reaproveitar` (scripts/ci-reaproveitar.mjs), que olha a execução do PR.
      # Depois de 7 dias sem merge, a main simplesmente roda tudo.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-verificacoes
          # Re-run de todos os jobs grava de novo na mesma execução.
          overwrite: true
          path: |
            reports/ci/static.json
            reports/ci/database.json
          retention-days: 7
          if-no-files-found: error
      - name: Remover o PostgreSQL do job
        if: always()
        run: bash scripts/ci-postgres.sh remover

  # Build e, em seguida, a suíte crítica de navegador contra ESSE build, no mesmo
  # workspace (sem passar o runtime pelo disco entre jobs). Na main com as
  # verificações do PR reaproveitadas, só o build. Os fluxos críticos gravam no
  # banco e rodam com um worker; o smoke das telas no desktop só lê e roda com
  # dois (uns 15 s). Mobile e acessibilidade ficam no `npm run test:browser:local`.
  build:
    name: build e navegador
    needs: reaproveitar
    # A mesma trava do `verificações` para PR do Dependabot.
    if: >-
      ${{ !cancelled()
      && (github.event.pull_request.user.login != 'dependabot[bot]'
      || (github.event.action == 'labeled' && github.event.label.name == 'dependencias-revisadas')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NAVEGADOR: ${{ needs.reaproveitar.outputs.reuse != 'true' }}
      # Vazias, os scripts pedem portas livres ao sistema (AB_E2E_PORT,
      # PLAYWRIGHT_WS_PORT).
      AB_E2E_PORT: ""
      PLAYWRIGHT_WS_PORT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-npm
      # Mesma regra do cache de tipos: uma entrada por execução, restaurada pela
      # mais recente do mesmo lockfile e next.config.
      - name: Restaurar cache do Next
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: next-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      - run: node scripts/record-check.mjs build -- npm run build
      - run: npm run package:worker
      - name: Construir imagem do worker
        run: docker build --file Dockerfile.worker --tag automabaca-worker:check dist/worker-runtime
      - run: node scripts/record-check.mjs package -- npm run package:release
      # Só a `release verificada` desta execução lê: um dia basta (o runtime tem
      # ~80 MB e divide a cota de armazenamento com o registry).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-build
          overwrite: true
          path: |
            reports/ci/build.json
            reports/ci/package.json
            reports/ci/runtime.json
            reports/ci/runtime.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Salvar cache do Next
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: PostgreSQL em RAM deste job
        if: env.NAVEGADOR == 'true'
        run: bash scripts/ci-postgres.sh subir automabaca_e2e
      # O standalone em disco é o que acabou de ser empacotado no runtime.tar.gz.
      - name: Fluxos críticos no navegador
        id: navegador
        if: env.NAVEGADOR == 'true'
        env:
          SKIP_BUILD: "1"
          AUTH_SESSION_SECRET: ci-session-secret-with-at-least-32-characters
          LOG_HASH_SECRET: ci-log-secret-with-at-least-32-characters
        run: bash scripts/vez.sh -- node scripts/record-check.mjs browser -- bash scripts/run-browser-suite.sh bash scripts/run-playwright-canonical.sh npm run test:browser:critical
      # Como o `ci-verificacoes`: a main reaproveita por até 7 dias.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.NAVEGADOR == 'true'
        with:
          name: ci-navegador
          overwrite: true
          path: reports/ci/browser.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() && steps.navegador.outcome == 'failure'
        with:
          name: browser-traces
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Remover o PostgreSQL do job
        if: always()
        run: bash scripts/ci-postgres.sh remover

  release:
    name: release verificada
    needs: [reaproveitar, verificacoes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # artefatos da execução do PR, quando reaproveitada
    env:
      REUSO: ${{ needs.reaproveitar.result == 'success' && needs.reaproveitar.outputs.reuse == 'true' }}
    steps:
      # Com as verificações do PR reaproveitadas, `verificações` fica pulado de
      # propósito; em qualquer outro caso, tudo tem de estar verde.
      - name: Exigir todos os gates aprovados
        env:
          VERIFICACOES_RESULT: ${{ needs.verificacoes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$REUSO" = true ]; then esperado=skipped/success; else esperado=success/success; fi
          echo "verificações/build e navegador = $VERIFICACOES_RESULT/$BUILD_RESULT (esperado $esperado)"
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ] && [ "$BUILD_RESULT" = skipped ]; then
            echo "::error::PR do Dependabot: a CI só roda quando o rótulo dependencias-revisadas é posto (de novo a cada push), depois de ler o diff do lockfile e as notas de versão"
          fi
          test "$VERIFICACOES_RESULT/$BUILD_RESULT" = "$esperado"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-npm
        with:
          install-deps: "false"
      # O manifesto confere o SHA-256 do runtime e o fonte de cada verificação.
      # O build é sempre desta execução; as verificações, desta ou (reaproveitadas)
      # da execução do PR.
      - name: Build desta execução
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-build
          path: reports/ci
      - name: Verificações desta execução
        if: env.REUSO != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-{verificacoes,navegador}
          merge-multiple: true
          path: reports/ci
      - name: Verificações da execução do PR
        if: env.REUSO == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-{verificacoes,navegador}
          merge-multiple: true
          path: reports/ci
          run-id: ${{ needs.reaproveitar.outputs.run }}
          github-token: ${{ github.token }}
      - name: Todos os registros presentes
        run: |
          for nome in build package runtime static database browser; do
            test -f "reports/ci/$nome.json" || { echo "::error::falta reports/ci/$nome.json"; exit 1; }
          done
          test -f reports/ci/runtime.tar.gz
      - run: npm run release:manifest
        env:
          CI_REAPROVEITADO_RUN: ${{ env.REUSO == 'true' && needs.reaproveitar.outputs.run || '' }}
          CI_REAPROVEITADO_COMMIT: ${{ env.REUSO == 'true' && needs.reaproveitar.outputs.commit || '' }}
      # Consumido pelo `publicar.sh` na VPS, que só publica a main, e pelo job
      # `imagens` logo abaixo. Cada release publicada guarda a própria cópia em
      # evidence/releases/, então 14 dias bastam.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref == 'refs/heads/main'
        with:
          name: release-${{ github.sha }}
          path: |
            reports/ci/runtime.tar.gz
            reports/ci/release-manifest.json
          retention-days: 14
          if-no-files-found: error

  imagens:
    name: imagens publicadas no registry
    needs: [release]
    # Só na main: uma imagem por PR encheria o registry sem que nada as consuma.
    # `!cancelled()` e o resultado explícito: sem uma função de status, o
    # `success()` implícito olha a cadeia inteira, e o `verificações` pulado
    # (verificações do PR reaproveitadas) pularia este job também.
    if: ${{ !cancelled() && needs.release.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write   # poda dos artefatos release-* antigos, no fim do job
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-npm
      # Em `reports/` (ignorado pelo git): arquivo novo em outro lugar entraria no
      # snapshot da árvore e o verify-release acusaria checkout divergente.
      - name: Release desta execução
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: reports/ci
      # Mesma conferência que o servidor faz: o conteúdo bate com este commit.
      - run: node scripts/verify-release.mjs reports/ci
      - name: Montar as camadas
        run: node scripts/montar-camadas-de-imagem.mjs --artifact reports/ci --out reports/camadas
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Runner novo a cada execução: a imagem base vem do registry. Sem
      # atestado de procedência: com ele cada push viraria três versões no
      # registry (ver scripts/podar-versoes-do-registry.mjs).
      - name: Publicar web e worker
        id: publicar
        run: |
          set -euo pipefail
          for papel in web worker; do
            docker buildx build --builder default --provenance=false --sbom=false --push \
              --file "Dockerfile.$papel" --tag "$REGISTRY/automabaca-novo-$papel:$GITHUB_SHA" \
              --metadata-file "reports/meta-$papel.json" "reports/camadas/$papel-layer"
            echo "$papel=$(node -p "require('./reports/meta-$papel.json')['containerimage.digest']")" >> "$GITHUB_OUTPUT"
          done
      - name: Registrar as referências publicadas
        run: |
          printf '%s\n' \
            '{"commit":"${{ github.sha }}",' \
            ' "web":"${{ env.REGISTRY }}/automabaca-novo-web@${{ steps.publicar.outputs.web }}",' \
            ' "worker":"${{ env.REGISTRY }}/automabaca-novo-worker@${{ steps.publicar.outputs.worker }}"}' > reports/imagens-publicadas.json
          cat reports/imagens-publicadas.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imagens-${{ github.sha }}
          path: reports/imagens-publicadas.json
          retention-days: 90
          if-no-files-found: error
      # Sem poda o registry cresce ~1,2 GB por integração e estoura a cota da
      # conta, o que para a CI.
      - name: Podar versões antigas do registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DONO: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for papel in web worker; do
            pacote="automabaca-novo-$papel"
            echo "== $pacote =="
            gh api --paginate "/users/$DONO/packages/container/$pacote/versions" \
              | node scripts/podar-versoes-do-registry.mjs > alvos.txt
            while read -r id; do
              [ -z "$id" ] && continue
              gh api --method DELETE "/user/packages/container/$pacote/versions/$id"
              echo "apagada versão $id"
            done < alvos.txt
          done
      # Artefatos e pacotes dividem a cota de armazenamento do plano; cada
      # release-<sha> tem ~80 MB. Ficam os 3 mais recentes (o bastante para
      # publicar os últimos merges). `always()`: roda mesmo se a publicação falhar.
      - name: Podar artefatos de release antigos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("release-")) | "\(.created_at) \(.id) \(.name)"' \
            | sort -r | tail -n +4 > artefatos-velhos.txt
          while read -r _ id nome; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "apagado artefato $nome"
          done < artefatos-velhos.txt
