# Substitui /usr/lib/tmpfiles.d/tmp.conf (mesmo nome = override, ver tmpfiles.d(5)).
#
# O padrão do sistema é 30d. Nesta máquina agentes de IA criam worktrees e
# diretórios de trabalho em /tmp e não limpam: em 17/09/2026 havia 699
# diretórios somando 25 GB, o mais antigo de 5 de setembro. Nada estava
# quebrado — o systemd-tmpfiles-clean.timer roda todo dia — a janela é que era
# larga demais para o ritmo de sujeira daqui.
#
# 7d dá folga de uma semana para retomar trabalho parado e ainda assim impede o
# acúmulo virar gigabytes.
#
# A linha `x` protege o scratchpad das sessões do Claude: uma sessão longa pode
# ter arquivo com atime antigo e ainda estar viva, e perder isso no meio do
# trabalho é pior que o disco ocupado.

x /tmp/claude-*

D /tmp 1777 root root 7d
