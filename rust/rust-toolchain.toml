# Versão fixada: a CI e as máquinas de desenvolvimento compilam com a mesma.
# Atualizar é um PR que troca só esta linha (e o que o clippy novo pedir).
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
# O navegador recebe o mesmo crate compilado para WebAssembly.
targets = ["wasm32-unknown-unknown"]
